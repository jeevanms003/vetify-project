version: "3.8"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vetify-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./vetify.db
      - ADMIN_KEY=vetify-secret-admin-key-2026
      - CHAOS=0
    volumes:
      - ./server/data:/app/server/data
      - ./server/keys:/app/server/keys
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
